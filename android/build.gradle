allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    def setNamespaceIfMissing = {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt == null || !androidExt.hasProperty('namespace')) {
            return
        }

        def currentNamespace = androidExt.namespace
        if (currentNamespace != null && currentNamespace.toString().trim()) {
            return
        }

        def manifestFile = subproject.file('src/main/AndroidManifest.xml')
        if (manifestFile.exists()) {
            def manifestText = manifestFile.getText('UTF-8')
            def matcher = manifestText =~ /package="([^"]+)"/
            if (matcher.find()) {
                androidExt.namespace = matcher.group(1)
                return
            }
        }

        androidExt.namespace = "com.generated.${subproject.name.replace('-', '_')}"
    }

    subproject.plugins.withId('com.android.application') {
        setNamespaceIfMissing()
    }
    subproject.plugins.withId('com.android.library') {
        setNamespaceIfMissing()
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
